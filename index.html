<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#1e293b', 900: '#0f172a' },
                        nbc: {
                            yellow: '#FDB813', orange: '#F58025', red: '#D52B1E',
                            purple: '#6F2C91', blue: '#007AC9', green: '#3FA535',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; transition: background-color 0.3s ease; }
        .dark body { background-color: #0f172a; }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); position: relative; overflow: hidden; }
        .hero-gradient::before {
            content: ''; position: absolute; top: -50%; right: -20%; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(111, 44, 145, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; z-index: 0; animation: pulse-slow 8s infinite alternate;
        }
        @keyframes pulse-slow { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0.8; } }
        .tool-card { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); border: 1px solid transparent; }
        .tool-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-color: #007AC933; }
        .icon-bg-day { background: linear-gradient(135deg, #FDB813, #F58025); }
        .icon-bg-ops { background: linear-gradient(135deg, #007AC9, #6F2C91); }
        .icon-bg-hr { background: linear-gradient(135deg, #3FA535, #007AC9); }
        .icon-bg-audit { background: linear-gradient(135deg, #D52B1E, #F58025); }
        .icon-bg-cx { background: linear-gradient(135deg, #6F2C91, #D52B1E); }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="min-h-screen flex flex-col">

    <header class="hero-gradient shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-nbc-purple to-nbc-blue flex items-center justify-center shadow-lg ring-2 ring-white/20">
                        <i data-lucide="zap" class="text-white w-6 h-6"></i>
                    </div>
                    <div>
                        <span class="block text-2xl font-black tracking-tight text-white uppercase">RepHub</span>
                        <span class="block text-xs text-slate-300 font-medium -mt-1 uppercase tracking-wider">Frontline Edition</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="hidden md:flex bg-white/10 backdrop-blur-md rounded-full p-1 border border-white/10">
                        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="px-6 py-2 rounded-full text-sm font-bold transition-all text-slate-900 bg-white shadow-sm">Tools</button>
                        <button onclick="switchTab('directory')" id="nav-directory" class="px-6 py-2 rounded-full text-sm font-bold transition-all text-slate-300 hover:text-white">Directory</button>
                    </div>
                    <div class="h-8 w-px bg-white/20 mx-2 hidden md:block"></div>
                    <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors backdrop-blur-sm">
                        <i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i>
                    </button>
                    <div class="md:hidden">
                        <button onclick="toggleMobileMenu()" class="p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
                            <i data-lucide="menu" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="hero-welcome" class="py-8 md:py-12 fade-in">
                <h1 class="text-3xl md:text-5xl font-bold text-white mb-2">Let's crush it today.</h1>
                <p class="text-slate-300 text-lg md:text-xl max-w-2xl">Everything you need to sell, serve, and succeed—right at your fingertips.</p>
            </div>
        </div>
    </header>

    <div id="mobile-menu" class="hidden md:hidden bg-slate-900 border-b border-slate-800 absolute w-full z-40 top-20 shadow-2xl">
        <div class="px-4 py-4 space-y-2">
            <button onclick="switchTab('dashboard')" class="block w-full px-4 py-3 rounded-xl text-left font-bold text-white bg-white/10">Tools</button>
            <button onclick="switchTab('directory')" class="block w-full px-4 py-3 rounded-xl text-left font-bold text-slate-400 hover:text-white hover:bg-white/5">Directory</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full relative z-0 -mt-6">
        
        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="fade-in">
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-black/50 mb-10 flex items-center gap-4 border border-slate-100 dark:border-slate-700">
                <i data-lucide="search" class="text-slate-400 w-6 h-6"></i>
                <input type="text" id="tool-search" onkeyup="filterTools()" placeholder="Search apps, links, or keywords..." class="bg-transparent border-none focus:ring-0 text-lg w-full text-slate-900 dark:text-white placeholder-slate-400">
            </div>

            <div id="favorites-section" class="hidden mb-12">
                <div class="flex items-center gap-2 mb-4 px-1">
                    <div class="w-1.5 h-6 bg-nbc-yellow rounded-full"></div>
                    <h3 class="text-lg font-black text-slate-700 dark:text-slate-300 uppercase tracking-widest">Quick Access</h3>
                </div>
                <div id="favorites-container" class="grid gap-5 grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
                <div class="h-px bg-slate-200 dark:bg-slate-800 my-8"></div>
            </div>

            <div id="tools-container" class="space-y-12"></div>
        </div>

        <!-- DIRECTORY VIEW -->
        <div id="view-directory" class="hidden fade-in">
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-black/50 mb-8 flex items-center gap-4 border border-slate-100 dark:border-slate-700">
                <i data-lucide="users" class="text-slate-400 w-6 h-6"></i>
                <input type="text" id="directory-search" onkeyup="filterDirectory()" placeholder="Find a department or phone number..." class="bg-transparent border-none focus:ring-0 text-lg w-full text-slate-900 dark:text-white placeholder-slate-400">
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-lg border border-slate-100 dark:border-slate-700 overflow-hidden">
                <div class="min-w-full overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-100 dark:divide-slate-700">
                        <thead class="bg-slate-50 dark:bg-slate-900/50">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Service Name</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Role</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Dept</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Phone</th>
                                <th class="px-6 py-4 text-right"></th>
                            </tr>
                        </thead>
                        <tbody id="directory-body" class="divide-y divide-slate-100 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let favorites = JSON.parse(localStorage.getItem('leaderHubFavorites')) || [];

        const toolsData = [
            {
                category: "Day to Day",
                style: "icon-bg-day",
                items: [
                    { name: "ECM", url: "https://ecm.comcast.com/ecm", customIcon: `<svg width="24" height="20" viewBox="0 0 40 24" fill="none" class="text-white"><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="currentColor">ecm</text></svg>`, desc: "Pathway to ticketing" },
                    { name: "BA Leads", url: "https://www.comcastbizleads.com/Saml/AssertionConsumerService", icon: "briefcase", desc: "Submit and track Business Advantage leads" },
                    { name: "Fetch It Up", url: "https://fetchitup.comcast.com/#/login", icon: "search", desc: "Quick account retrieval tool" },
                    { name: "ABT", url: "https://abt.cable.comcast.com/", icon: "home", desc: "New builds, modify existing address" },
                    { name: "Cash Management", url: "https://rposportal.comcast.com/cash-drawer", icon: "dollar-sign", desc: "Monthly Cash Audits" },
                    { name: "Einstein", url: "https://einstein360.cable.comcast.com/einstein_nxtgen#Layout=1", icon: "brain", desc: "Notes, billing, autopay" },
                    { name: "Retail 360", url: "https://retail360a.cable.comcast.com/login-nextgen#Layout=1", customIcon: `<svg width="24" height="20" viewBox="0 0 40 24" fill="none" class="text-white"><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="currentColor">360</text></svg>`, desc: "Manage equipment & XM" },
                    { name: "Celestial", url: "https://celestial.cable.comcast.com/knowledge/", icon: "cloud", desc: "Queue, POS, apps, promotions" },
                    { name: "IQ", url: "https://comcast.infoquest.tv/", icon: "bar-chart-2", desc: "Commissions for team" },
                    { name: "Xchange", url: "https://xchange3.performnet.com/", icon: "zap", desc: "Points, huddles, active incentives" },
                    { name: "XOE", url: "https://xoe-portal.cws.xfinity.com/", icon: "file-plus", desc: "New connects processing" },
                    { name: "UKG Pro", url: "https://comcastcable-sso.prd.mykronos.com/wfd/home", icon: "clock", desc: "Timekeeping & Scheduling" },
                    { name: "ComcastNow", url: "https://comcastcorp.sharepoint.com/sites/ComcastNow", icon: "info", desc: "Company news and info" },
                    { name: "Tech Spot", url: "https://techspot.comcast.com/techspot", icon: "settings", desc: "Onboarding tools" },
                    { name: "Digital Logs", url: "https://apps.powerapps.com/play/e/default-906aefe9-76a7-4f65-b82d-5ec20775d5aa/a/ecafd98b-7a86-40a0-aa6e-0ff7aeae24d9", icon: "clipboard", desc: "Access digital site logs" },
                ]
            },
            {
                category: "Training",
                style: "icon-bg-ops",
                items: [
                    { name: "Employee Handbook", url: "https://comcastcorp.sharepoint.com/sites/cn-hr/Shared%20Documents/Employee%20Handbook,%20Policies%20%26%20Guidelines/Employee_Handbook_Current.pdf", icon: "book-open", desc: "Policies & Guidelines" },
                    { name: "REG", url: "https://celestial.cable.comcast.com/knowledge/frontline-effectiveness/retail-excellence-guide/", icon: "check-circle", desc: "Retail Excellence Guide" },
                    { name: "Product Lab", url: "https://apps.powerapps.com/play/e/115b9293-5645-e9ec-8d47-2bd945210012", icon: "flask-conical", desc: "Product knowledge modules" },
                ]
            },
            {
                category: "Operations & HR",
                style: "icon-bg-hr",
                items: [
                    { name: "Workday", url: "https://wd5.myworkday.com/comcast/d/home.htmld", icon: "briefcase", desc: "Check-ins, Trainings, CA" },
                    { name: "Expense Reporting", url: "https://myexpense.comcast.com/login", icon: "wallet", desc: "Travel & P-card" },
                    { name: "XISCO", url: "https://xisco.comcast.net/home/menu", icon: "smartphone", desc: "Trade-in lookup by IMEI" },
                    { name: "Xinventory", url: "https://cceis.mintek.com/xInventory/dashboard", icon: "barcode", desc: "Shipping & receiving" },
                ]
            },
            {
                category: "Elevations",
                style: "icon-bg-cx",
                items: [
                    { name: "JIRA Access request form", url: "https://app.smartsheet.com/b/form/019cd8b044a07fc298b45cbb67ee652b", icon: "file-plus", desc: "Request access to the JIRA ticketing system" },
                ]
            }
        ];

        const directoryData = [
            { name: "Support NOW", role: "IT Support", dept: "IT", phone: "(888) 570-0778" },
            { name: "Shana Farer-Feld", role: "RDM", dept: "Retail Sales", phone: "(603) 759-3491" },
            { name: "Customer Care", role: "General Support", dept: "Care", phone: "(800) 934-6489" },
            { name: "Xfinity Mobile", role: "Mobile Support", dept: "XM", phone: "(888) 934-6489" },
        ];

        function getCardHtml(item, categoryStyle, isFav = false) {
            const isFavorited = favorites.includes(item.name);
            const favClass = isFavorited ? "fill-nbc-yellow text-nbc-yellow" : "text-slate-300 dark:text-slate-500 hover:text-nbc-yellow";
            const iconHtml = item.customIcon ? item.customIcon : `<i data-lucide="${item.icon || 'link'}" class="w-6 h-6 text-white"></i>`;

            return `
            <div class="tool-card group relative flex flex-col p-5 rounded-3xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 shadow-md dark:shadow-none">
                <button onclick="toggleFavorite('${item.name}')" class="absolute top-4 right-4 p-1 z-20 transition-all active:scale-90">
                    <i data-lucide="star" class="w-5 h-5 ${favClass}"></i>
                </button>
                <a href="${item.url}" target="_blank" class="flex-grow flex flex-col">
                    <div class="mb-4">
                        <div class="w-12 h-12 rounded-2xl ${categoryStyle} flex items-center justify-center shadow-lg ring-4 ring-white dark:ring-slate-700">
                            ${iconHtml}
                        </div>
                    </div>
                    <div>
                        <h4 class="text-lg font-bold text-slate-800 dark:text-white mb-1 leading-tight">${item.name}</h4>
                        <p class="text-sm text-slate-500 dark:text-slate-400 line-clamp-2">${item.desc}</p>
                    </div>
                </a>
            </div>`;
        }

        function renderTools() {
            const favItems = [];
            toolsData.forEach(cat => cat.items.forEach(i => { if (favorites.includes(i.name)) favItems.push({...i, style: cat.style}); }));
            
            const favSection = document.getElementById('favorites-section');
            document.getElementById('favorites-container').innerHTML = favItems.map(i => getCardHtml(i, i.style, true)).join('');
            favSection.style.display = favItems.length ? 'block' : 'none';

            document.getElementById('tools-container').innerHTML = toolsData.map(section => `
                <div>
                    <div class="flex items-center gap-3 mb-6">
                        <div class="h-8 w-1.5 rounded-full ${section.style}"></div>
                        <h3 class="text-2xl font-black text-slate-800 dark:text-white tracking-tight uppercase">${section.category}</h3>
                    </div>
                    <div class="grid gap-5 grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
                        ${section.items.map(i => getCardHtml(i, section.style)).join('')}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderDirectory() {
            const term = document.getElementById('directory-search').value.toLowerCase();
            const filtered = directoryData.filter(p => p.name.toLowerCase().includes(term) || p.dept.toLowerCase().includes(term));
            
            document.getElementById('directory-body').innerHTML = filtered.map(p => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                    <td class="px-6 py-5 text-sm font-bold text-slate-900 dark:text-white">${p.name}</td>
                    <td class="px-6 py-5 text-sm text-slate-600 dark:text-slate-300 font-medium">${p.role}</td>
                    <td class="px-6 py-5"><span class="px-3 py-1 text-[10px] font-black uppercase rounded-full bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300 border border-blue-100 dark:border-blue-800">${p.dept}</span></td>
                    <td class="px-6 py-5 text-sm text-slate-500 dark:text-slate-400 font-mono tracking-tight">${p.phone}</td>
                    <td class="px-6 py-5 text-right">
                        <button onclick="copyPhone('${p.phone}', this)" class="p-2 text-slate-400 hover:text-nbc-green transition-colors"><i data-lucide="copy" class="w-5 h-5"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function switchTab(tabId) {
            document.getElementById('view-dashboard').style.display = tabId === 'dashboard' ? 'block' : 'none';
            document.getElementById('view-directory').style.display = tabId === 'directory' ? 'block' : 'none';
            document.getElementById('nav-dashboard').className = tabId === 'dashboard' ? "px-6 py-2 rounded-full text-sm font-bold transition-all text-slate-900 bg-white shadow-sm" : "px-6 py-2 rounded-full text-sm font-bold transition-all text-slate-300 hover:text-white";
            document.getElementById('nav-directory').className = tabId === 'directory' ? "px-6 py-2 rounded-full text-sm font-bold transition-all text-slate-900 bg-white shadow-sm" : "px-6 py-2 rounded-full text-sm font-bold transition-all text-slate-300 hover:text-white";
            document.getElementById('mobile-menu').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        function filterTools() {
            const term = document.getElementById('tool-search').value.toLowerCase();
            document.querySelectorAll('.tool-card').forEach(c => {
                const text = c.innerText.toLowerCase();
                c.style.display = text.includes(term) ? 'flex' : 'none';
            });
        }

        function filterDirectory() { renderDirectory(); }

        function copyPhone(text, btn) {
            const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            btn.innerHTML = `<i data-lucide="check" class="w-5 h-5 text-nbc-green"></i>`; lucide.createIcons();
            setTimeout(() => { btn.innerHTML = `<i data-lucide="copy" class="w-5 h-5"></i>`; lucide.createIcons(); }, 2000);
        }

        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }

        function toggleFavorite(name) {
            favorites = favorites.includes(name) ? favorites.filter(f => f !== name) : [...favorites, name];
            localStorage.setItem('leaderHubFavorites', JSON.stringify(favorites));
            renderTools();
        }

        window.onload = () => { renderTools(); renderDirectory(); };
    </script>
</body>
</html>
